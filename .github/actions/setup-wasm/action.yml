name: Setup wasm build env
description: Installs Rust (wasm32 target) and the wasm-bindgen-cli pinned by the project.

inputs:
  wasm-bindgen-version:
    description: wasm-bindgen-cli version (must match the wasm-bindgen crate)
    required: false
    default: 0.2.127
  binaryen-version:
    description: binaryen release tag (provides wasm-opt)
    required: false
    default: version_132

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Install wasm-bindgen-cli
      run: |
        VERSION=${{ inputs.wasm-bindgen-version }}
        curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
        echo "$PWD/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      shell: bash
    - name: Install binaryen (wasm-opt)
      run: |
        VERSION=${{ inputs.binaryen-version }}
        curl -fsSL --retry 3 "https://github.com/WebAssembly/binaryen/releases/download/${VERSION}/binaryen-${VERSION}-x86_64-linux.tar.gz" | tar xz
        echo "$PWD/binaryen-${VERSION}/bin" >> "$GITHUB_PATH"
      shell: bash
